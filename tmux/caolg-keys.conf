# Atajos de CaoLg. Solo cambian el comportamiento dentro de sesiones cao-*; afuera hacen lo mismo que
# ~/.config/tmux/tmux.conf (Alt+N = ventana N) o pasan la tecla a la app (Alt+z, Alt+c).
# Lo carga caolg-session. Si recargás tu tmux.conf (prefix q), se vuelve a cargar al abrir otra sesión caolg.
bind -n M-1 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.1 } { select-window -t 1 }
bind -n M-2 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.2 } { select-window -t 2 }
bind -n M-3 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.3 } { select-window -t 3 }
bind -n M-4 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.4 } { select-window -t 4 }
bind -n M-5 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.5 } { select-window -t 5 }
bind -n M-6 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.6 } { select-window -t 6 }
bind -n M-7 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.7 } { select-window -t 7 }
bind -n M-8 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.8 } { select-window -t 8 }
bind -n M-9 if -F "#{m:cao-*,#{session_name}}" { select-window -t :caolg ; select-pane -t :caolg.9 } { select-window -t 9 }
bind -n M-z if -F "#{m:cao-*,#{session_name}}" { resize-pane -Z } { send-keys M-z }
bind -n M-c if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-clear '#{session_name}'" } { send-keys M-c }
