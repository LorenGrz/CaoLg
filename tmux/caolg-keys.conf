# Atajos de CaoLg. Solo cambian el comportamiento dentro de sesiones cao-*; afuera hacen lo mismo que
# ~/.config/tmux/tmux.conf (Alt+N = ventana N, Alt+Enter = split…) o pasan la tecla a la app.
# Lo carga caolg-session. Si recargás tu tmux.conf (prefix q), se vuelve a cargar al abrir otra sesión caolg.
# La mitad derecha son tabs (bin/caolg-tabs): Alt+1 = Opus, Alt+2..9 y Alt+0 = tabs.
bind -n M-1 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 1" } { select-window -t 1 }
bind -n M-2 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 2" } { select-window -t 2 }
bind -n M-3 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 3" } { select-window -t 3 }
bind -n M-4 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 4" } { select-window -t 4 }
bind -n M-5 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 5" } { select-window -t 5 }
bind -n M-6 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 6" } { select-window -t 6 }
bind -n M-7 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 7" } { select-window -t 7 }
bind -n M-8 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 8" } { select-window -t 8 }
bind -n M-9 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 9" } { select-window -t 9 }
bind -n M-0 if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' show 0" } { send-keys M-0 }
bind -n M-Right if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' next" } { select-window -t +1 }
bind -n M-Left if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' prev" } { select-window -t -1 }
bind -n M-S-Right if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' move right" } { swap-window -t +1 ; select-window -t +1 }
bind -n M-S-Left if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' move left" } { swap-window -t -1 ; select-window -t -1 }
bind -n M-Enter if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' new '#{pane_current_path}'" } { split-window -v -c "#{pane_current_path}" }
bind -n M-S-Enter if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' new '#{pane_current_path}'" } { split-window -h -c "#{pane_current_path}" }
bind -n M-Escape if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' close '#{pane_id}'" } { kill-pane }
bind -n M-i if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-tabs '#{session_name}' role-menu '#{pane_id}'" } { send-keys M-i }
bind -n M-z if -F "#{m:cao-*,#{session_name}}" { resize-pane -Z } { send-keys M-z }
bind -n M-c if -F "#{m:cao-*,#{session_name}}" { run-shell -b "~/.local/bin/caolg-clear '#{session_name}'" } { send-keys M-c }
